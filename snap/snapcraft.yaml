name: magician
version: "0.1.0"
summary: Juju model management UI with Flask backend and Svelte frontend.
description: |
  Magician is a web-based tool for deploying and managing Juju models.
  It bundles a Flask API backend (port 5000) and a Svelte frontend
  served via Vite preview (port 8080) in a single classic snap.

base: core24
grade: devel
confinement: classic

platforms:
  ubuntu@24.04:amd64:

apps:
  backend:
    command: bin/start-backend.sh
    daemon: simple

  frontend:
    command: bin/start-frontend.sh
    daemon: simple

parts:
  backend:
    plugin: python
    source: backend/
    python-requirements:
      - requirements.txt
    python-packages:
      - pip
      - setuptools
      - wheel
    build-packages:
      - python3-dev
      - python3-venv
    stage-packages:
      - python3.12
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib

  backend-source:
    plugin: dump
    source: backend/
    stage:
      - app.py

  frontend:
    plugin: npm
    source: frontend/
    npm-node-version: "20.18.1"
    npm-include-node: true
    override-build: |
      craftctl default
      export PATH="$CRAFT_PART_INSTALL/bin:$PATH"
      cd $CRAFT_PART_BUILD
      npm install --include=dev
      npm run build
      mkdir -p $CRAFT_PART_INSTALL/frontend
      cp -r dist $CRAFT_PART_INSTALL/frontend/
      cp -r node_modules $CRAFT_PART_INSTALL/frontend/
      cp vite.config.js $CRAFT_PART_INSTALL/frontend/
      cp package.json $CRAFT_PART_INSTALL/frontend/

  launchers:
    plugin: dump
    source: snap/local/
    organize:
      start-backend.sh: bin/start-backend.sh
      start-frontend.sh: bin/start-frontend.sh
