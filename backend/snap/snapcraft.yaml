name: magician-backend
version: '0.1.0'
summary: Flask backend for Magician.
description: |
  A Flask API backend that wraps the Juju CLI using the jubilant library.
  Requires classic confinement to run subprocess calls (e.g. juju CLI).

base: core24
grade: devel
confinement: classic

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  magician-backend:
    command: bin/start.sh
    daemon: simple

parts:
  backend:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    python-packages:
      - pip
      - setuptools
      - wheel
    build-packages:
      - python3-dev
      - python3-venv
    stage-packages:
      - python3.12
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib

  launcher:
    plugin: dump
    source: snap/local/
    organize:
      start.sh: bin/start.sh

  app-source:
    plugin: dump
    source: .
    stage:
      - app.py
